# HyprWave Configuration File

[General]
# Edge to anchor HyprWave to
# Options: right, left, top, bottom
edge = right

# Margin from the screen edge (in pixels)
margin = 10

# Theme: light or dark
theme = light

# Size: tiny, small, default, large
size = default

# Volume method: auto, pipewire, mpris
volume_method = auto

[Notifications]
enabled = true
now_playing = true

[Visualizer]
# Enable/disable expanded-section visualizer in all layouts
enabled = true

# Horizontal layouts only: seconds before idle visualizer mode appears
# Set to 0 to disable automatic idle visualizer mode
idle_timeout = 30

[VerticalDisplay]
# Vertical layouts only: dot matrix idle display
enabled = true
idle_timeout = 5
